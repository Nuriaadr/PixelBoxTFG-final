<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>PixelBox - VistaAdmin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../estilos/style.css">
</head>

<body>
    <header class="admin-header-v2">
        <div class="admin-profile">
            <div class="admin-avatar-wrapper">
                <i data-lucide="shield-check"></i>
            </div>
            <div class="admin-info">
                <h1>Panel de Administración</h1>
                <p>Gestiona juegos y usuarios del sistema</p>
            </div>
        </div>

        <button id="logoutBtnAdmin" class="btn-logout-refined">
            <i data-lucide="log-out"></i>
            <span>Cerrar sesión</span>
        </button>
    </header>
    <div class="admin-nav-container">
        <div class="admin-tabs">
            <button class="tab-item active" data-tab="games">
                <i data-lucide="gamepad-2"></i>
                <span>Juegos <span class="tab-count" id="gamesCount">(8)</span></span>
            </button>
            <button class="tab-item" data-tab="users">
                <i data-lucide="users"></i>
                <span>Usuarios <span class="tab-count" id="usersCount">(7)</span></span>
            </button>
        </div>

        <div class="tab-separator"></div>

        <div class="action-bar">
            <button class="search-icon-btn" id="openSearchModalBtn" title="Buscar">
                <i data-lucide="search"></i>
            </button>
            <button class="btn-add-flat" id="addBtn">
                <i data-lucide="plus"></i>
                <span id="addBtnText">Añadir Juego</span>
            </button>
        </div>
    </div>

    <div id="searchModal" class="modal hidden">
        <div class="modal-content search-modal-content">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Busca un juego por nombre..."
                    class="search-input"
                >
                <button id="closeSearchModal" class="search-close-btn" title="modal busqueda">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div id="searchResults" class="search-results">
                <p class="search-placeholder">Escribe para buscar juegos...</p>
            </div>
        </div>
    </div>

    <!-- Modal para Añadir/Editar Usuario -->
    <div id="userModal" class="modal hidden">
        <div class="modal-content game-modal-content">
            <div class="modal-header">
                <h2 id="userModalTitle">Añadir Usuario</h2>
                <button class="modal-close-btn" id="closeUserModal" title="Cerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label for="userName">Nombre de usuario</label>
                    <input type="text" id="userName" placeholder="@usuario" required>
                </div>
                <div class="form-group">
                    <label for="userDescription">Descripción</label>
                    <textarea id="userDescription" rows="3" placeholder="Descripción del usuario..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelUserBtn">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Añadir/Editar Juego -->
    <div id="gameModal" class="modal hidden">
        <div class="modal-content game-modal-content">
            <div class="modal-header">
                <h2 id="gameModalTitle">Añadir Juego</h2>
                <button class="modal-close-btn" id="closeGameModal" title="Cerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="gameForm">
                <div class="form-group">
                    <label for="gameName">Nombre del Juego</label>
                    <input type="text" id="gameName" required>
                </div>
                <div class="form-group">
                    <label for="gameYear">Año</label>
                    <input type="number" id="gameYear" required>
                </div>
                <div class="form-group">
                    <label for="gameDeveloper">Desarrollador</label>
                    <input type="text" id="gameDeveloper" required>
                </div>
                <div class="form-group">
                    <label for="gameDescription">Descripción</label>
                    <textarea id="gameDescription" rows="4" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="gameGenre">Género</label>
                        <input type="text" id="gameGenre" required>
                    </div>
                    <div class="form-group">
                        <label for="gamePlatform">Plataforma</label>
                        <input type="text" id="gamePlatform" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="gameRating">Calificación</label>
                        <input type="number" id="gameRating" min="0" max="5" step="0.1" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelGameBtn">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Juego</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación de Eliminación -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content delete-modal-content">
            <div class="modal-header">
                <h2>Confirmar Eliminación</h2>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que deseas eliminar <strong id="deleteItemName"></strong>?</p>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button class="btn-danger" id="confirmDeleteBtn">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Éxito -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content success-modal-content">
            <div class="modal-success-icon">
                <i data-lucide="check-circle"></i>
            </div>
            <h2 id="successModalTitle">¡Éxito!</h2>
            <p id="successModalMessage">Operación completada correctamente</p>
            <button class="btn-primary" id="closeSuccessModal">Continuar</button>
        </div>
    </div>

    <section class="game-list" id="gamesList">
    </section>

    <!-- Contenedor para la lista de usuarios (inicialmente oculto) -->
    <section class="user-list hidden" id="usersList">
    </section>

</body>

<script src="../js/global.js"></script>
<script src="../js/users.js"></script>
<script src="../js/search.js"></script>
<script src="../js/admin.js"></script>

</html>
