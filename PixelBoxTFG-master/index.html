<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelBox - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="login-page">

    <div class="container">

        <div class="logo">
            <i data-lucide="gamepad-2"></i>
            PixelBox
        </div>
        <div class="subtitle">Inicia sesión para continuar</div>

        <div class="card">

            <form>
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" placeholder="Ingresa tu usuario">
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Ingresa tu contraseña">
                </div>

                <a href="html/inicio.html" class="btn-primary">
                    Iniciar sesión
                </a>
            </form>

            <div class="divider"></div>

            <div class="test-title">Usuarios de prueba</div>

            <div class="test-card">
                <div class="role">Usuario normal</div>
                Usuario: <span class="highlight">jugador_pro</span><br>
                Contraseña: <span class="highlight">password</span>
            </div>

            <div class="test-card">
                <div class="role">Administrador</div>
                Usuario: <span class="highlight">admin</span><br>
                Contraseña: <span class="highlight">admin123</span>
            </div>

        </div>

    </div>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
